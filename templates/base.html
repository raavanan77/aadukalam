<!DOCTYPE html>
<html>
<head>
    <title>FIFA Banter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #e9ebee;
        }
        .card form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .card input {
            flex: 1;
        }
        .card {
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            background: #f0f0f0;
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        .group-table th,
        .group-table td {
            border: 1px solid #ccc;
            padding: 5px;
            text-align: center;
        }
        
        .group-table th {
            background: #3b5998;
            color: white;
        }
        
        .group-table td:first-child {
            text-align: left;
        }

        .bottom-nav {
            display: none;
        }

        /* ✅ Mobile only */
        @media (max-width: 768px) {
        
            .bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: #3b5998;
                justify-content: space-around;
                padding: 10px 0;
                z-index: 1000;
            }
        
            .bottom-nav a {
                color: white;
                text-decoration: none;
                font-size: 14px;
                text-align: center;
            }
        
            /* ✅ hide sidebar on mobile */
            .sidebar {
                display: none;
            }
        
            /* ✅ avoid content being hidden behind bar */
            .content {
                padding-bottom: 60px;
            }
        }
        /* Default layout */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar (desktop) */
        .sidebar {
            width: 200px;
            background: #3b5998;
            color: white;
            min-height: 100vh;
            padding: 15px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 8px 0;
        }

        /* Content */
        .content {
            flex: 1;
            padding: 15px;
        }

        /* Topbar (hidden on desktop) */
        .topbar {
            display: none;
        }

        /* ✅ Mobile styles */
        @media (max-width: 768px) {
        
            .layout {
                flex-direction: column;
            }
        
            .topbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #3b5998;
                color: white;
                padding: 10px;
            }
        
            .menu-btn {
                font-size: 20px;
                cursor: pointer;
            }
        
            /* Sidebar becomes hidden drawer */
            .sidebar {
                position: fixed;
                top: 0;
                left: -220px;
                width: 200px;
                height: 100%;
                transition: 0.3s;
                z-index: 1000;
            }
        
            .sidebar.open {
                left: 0;
            }
        
            .content {
                padding: 10px;
            }
        }
        .container {
            width: 90%;
            max-width: 350px;
            margin: 20px auto;
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
        }
        .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout {
    text-decoration: none;
    color: #3b5998;
}
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .card {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .matches-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.card-link {
    text-decoration: none;
    color: inherit;
}

@media (max-width: 900px) {
    .matches-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .matches-grid {
        grid-template-columns: 1fr;
    }
}

.comments {
    list-style: none;
    padding: 0;
}

.comments li {
    margin: 5px 0;
    padding: 8px;
    background: #f5f5f5;
    width: fit-content;
}

/* ✅ your messages → right */
.comments li.mine {
    margin-left: auto;
    background: #d1e7ff;
}

.match-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 5px;
}

.team {
    display: flex;
    align-items: center;
    gap: 5px;
}

.team img {
    width: 20px;
}

.vs {
    font-weight: bold;
}

    </style>
    <script>
        function toggleMenu() {
            document.getElementById("sidebar").classList.toggle("open");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" 
          integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
          crossorigin="anonymous">
    </script>

</head>
<body>

<div class="layout">

    <div class="sidebar" id="sidebar">
        <a href="/home">Home</a>
        <a href="/matches">Matches</a>
        <a href="/pointtable">Point Table</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/yourpicks">Your Pickems</a>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

</div>

<div class="bottom-nav">
    <a href="/home">Home</a>
    <a href="/matches">Matches</a>
    <a href="/pointtable">Point Table</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/yourpicks">Your Pickems</a>
</div>

</body>
</html>
