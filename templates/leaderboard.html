{% extends "base.html" %}

{% block content %}

<h2>Leaderboard</h2>

<div class="card">
    <table width="100%" class="group-table">
        <tr>
            <th>#</th>
            <th>User</th>
            <th>Points</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ row.user }}</td>
            <td>{{ row.points }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
