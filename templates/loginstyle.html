<!DOCTYPE html>
<html>
<head>
    <title>FIFA Banter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #e9ebee;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 350px;
            margin: 20px auto;
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #3b5998;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3b5998;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #2d4373;
        }

        .link {
            text-align: center;
            margin-top: 10px;
        }

        .link a {
            color: #3b5998;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
